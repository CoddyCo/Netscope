[build-system]
requires = ["setuptools>=68", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.0"
description = "Network Diagnostic & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohd Mursaleen"}]

dependencies = [
    "PyQt6>=6.6",
    "matplotlib>=3.8",
    "maxminddb>=2.6",
    "rich>=13.0",
    "pybind11>=2.11",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
]

[project.scripts]
netscope = "netscope.__main__:main"

[tool.setuptools.packages.find]
include = ["netscope*"]
